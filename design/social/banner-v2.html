<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
  :root {
    --primary: #e8673a;
    --primary-deep: #c4461e;
    --accent: #f2b25c;
    --success: #4cc38a;
    --cream: #fffaf3;
    --ink: #1c1714;
    --dark: #17120f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { font-family: "Hanken Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

  /* size presets: content is designed at LinkedIn scale (1584x396) and zoomed up */
  /* --z: center zoom, --zs: side zoom, --off: how far the side clusters bleed off the edge */
  .li { --z: 1;    --zs: 1;   --off: 0px; }
  .x  { --z: 1.08; --zs: .95; --off: -70px; }
  .fb { --z: 1.2;  --zs: 1.1; --off: -80px; }
  .light { --off: 0px; }
  .light.fb { --off: -50px; }
  .center {
    position: absolute; left: 50%; top: 50%; z-index: 3;
    transform: translate(-50%, -50%); zoom: var(--z);
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .side { position: absolute; top: calc(50vh / var(--zs) - 198px); width: 440px; height: 396px; zoom: var(--zs); z-index: 2; }
  .side.l { left: var(--off); }
  .side.r { right: var(--off); }
  .side svg.rib { position: absolute; inset: 0; width: 440px; height: 396px; overflow: visible; }
  .side > * { position: absolute; }

  .logos { display: flex; align-items: center; gap: 44px; }
  .logos img { height: 30px; display: block; }

  /* =================== A · LIGHT =================== */
  .light .stage {
    background:
      radial-gradient(ellipse 38% 85% at 50% 50%, rgba(242,178,92,.38), transparent 70%),
      radial-gradient(ellipse 30% 70% at 88% 40%, rgba(232,103,58,.16), transparent 70%),
      radial-gradient(ellipse 25% 60% at 8% 30%, rgba(242,178,92,.20), transparent 70%),
      var(--cream);
  }
  .light .stage::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(28,23,20,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(28,23,20,.045) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 60% 80% at 50% 50%, #000 20%, transparent 75%);
  }
  .light .stage::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--primary), transparent);
  }
  .tagline { display: flex; align-items: center; gap: 18px; }
  .pill {
    position: relative; font-size: 34px; font-weight: 700; color: var(--ink); letter-spacing: -.01em;
    padding: 10px 26px 12px; border-radius: 999px;
    background: linear-gradient(180deg, #ffd27e 0%, var(--accent) 55%, #eaa046 100%);
    box-shadow: 0 14px 28px -10px rgba(232,103,58,.55), inset 0 2px 0 rgba(255,255,255,.65), inset 0 -3px 0 rgba(196,70,30,.25);
  }
  .chev { display: flex; }
  .chev svg { width: 26px; height: 40px; margin-left: -6px; }
  .tag-text { font-size: 40px; font-weight: 600; color: var(--ink); letter-spacing: -.02em; }
  .tag-text em { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; color: var(--primary-deep); font-size: 46px; }
  .light .logos { margin-top: 40px; }
  .light .logos img { filter: grayscale(1) brightness(.35); opacity: .55; }
  .light .sub {
    margin-top: 16px; font-size: 15px; color: #6b6259; font-weight: 500;
  }
  .corner {
    position: absolute; right: 28px; bottom: 20px; z-index: 3; zoom: var(--z);
    display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink);
  }
  .corner img { height: 20px; }
  .ribbons { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  /* =================== B · DARK SHOWCASE =================== */
  .dark .stage {
    background:
      radial-gradient(ellipse 45% 75% at 50% 0%, rgba(232,103,58,.35), transparent 70%),
      radial-gradient(ellipse 30% 60% at 50% 100%, rgba(196,70,30,.22), transparent 70%),
      linear-gradient(180deg, #1f1510 0%, var(--dark) 100%);
    color: var(--cream);
  }
  .dark .stage::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,250,243,.09) 1.1px, transparent 1.1px);
    background-size: 22px 22px;
    mask-image: linear-gradient(180deg, transparent, #000 60%);
  }
  .ghost { position: absolute; z-index: 1; opacity: .07; filter: blur(1.5px); }
  .dark .brand img { height: 30px; display: block; }
  .badges { display: flex; gap: 12px; margin-top: 22px; }
  .badge {
    display: flex; align-items: center; gap: 9px; padding: 6px 14px 6px 6px; border-radius: 12px;
    background: rgba(255,250,243,.06); border: 1px solid rgba(255,250,243,.12); text-align: left;
  }
  .badge i {
    width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    font-style: normal; font-size: 14px; background: linear-gradient(135deg, var(--primary), var(--accent));
  }
  .badge small { display: block; font-size: 9px; color: #a99f93; text-transform: uppercase; letter-spacing: .1em; font-family: "JetBrains Mono", monospace; }
  .badge b { display: block; font-size: 13px; font-weight: 700; line-height: 1.1; }
  .dark h1 { margin-top: 22px; font-size: 46px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
  .dark h1 em { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; color: var(--accent); font-size: 52px; letter-spacing: -.01em; }
  .dark .logos { margin-top: 30px; gap: 40px; }
  .dark .logos img { height: 26px; filter: grayscale(1) brightness(0) invert(1); opacity: .55; }

  /* floating cards */
  .card {
    background: #fffaf3; color: var(--ink); border-radius: 14px;
    box-shadow: 0 24px 40px -12px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);
    font-size: 11px; overflow: hidden;
  }
  .card.d { background: #2a231e; color: var(--cream); border: 1px solid #3a3029; }
  .mono { font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: #8a8076; }

  .phone { width: 148px; height: 292px; border-radius: 26px; padding: 8px; background: #0e0b09; box-shadow: 0 30px 50px -14px rgba(0,0,0,.75), 0 0 0 1px #3a3029; }
  .phone .scr { width: 100%; height: 100%; border-radius: 19px; background: var(--cream); color: var(--ink); padding: 14px 11px; position: relative; overflow: hidden; }
  .phone .hero { height: 70px; border-radius: 12px; background: linear-gradient(135deg, #e8673a, #f2b25c); display: flex; align-items: flex-end; padding: 8px; color: #fff; font-weight: 800; font-size: 13px; line-height: 1; }
  .phone .row { display: flex; justify-content: space-between; align-items: center; margin-top: 9px; font-size: 10.5px; font-weight: 600; }
  .phone .row span:last-child { color: #8a8076; font-weight: 500; }
  .phone .dot { width: 22px; height: 22px; border-radius: 7px; background: #efe6d8; margin-right: 7px; flex: none; display: grid; place-items: center; font-size: 11px; }
  .phone .btn { position: absolute; left: 11px; right: 11px; bottom: 12px; height: 30px; border-radius: 999px; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 11px; }

  .cal { width: 176px; padding: 12px; }
  .cal .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
  .cal .grid span { height: 16px; border-radius: 5px; background: #efe6d8; font-size: 8px; display: grid; place-items: center; color: #8a8076; }
  .cal .grid span.on { background: var(--primary); color: #fff; font-weight: 700; }
  .cal .grid span.bk { background: rgba(232,103,58,.18); }
  .cal .t { font-weight: 700; font-size: 12px; margin-top: 2px; }

  .toast { display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 8px; border-radius: 999px; white-space: nowrap; font-weight: 600; font-size: 11.5px; }
  .toast i { width: 22px; height: 22px; border-radius: 50%; background: var(--success); color: #fff; font-style: normal; display: grid; place-items: center; font-size: 12px; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; border: 3px solid #fffaf3; box-shadow: 0 10px 20px -6px rgba(0,0,0,.6); display: grid; place-items: center; font-weight: 800; font-size: 15px; color: #fff; }

  .dash { width: 212px; padding: 14px; }
  .dash .big { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; }
  .dash .big span { font-size: 12px; color: var(--success); font-weight: 700; margin-left: 6px; }
  .dash .bars { display: flex; align-items: flex-end; gap: 7px; height: 58px; margin-top: 10px; }
  .dash .bars i { flex: 1; border-radius: 4px 4px 2px 2px; background: #efe6d8; }
  .dash .bars i.hi { background: linear-gradient(180deg, var(--accent), var(--primary)); }

  .ticket { width: 138px; padding: 12px; }
  .ticket .no { font-weight: 800; font-size: 15px; margin-top: 2px; }
  .ticket .li { display: flex; justify-content: space-between; border-top: 1px dashed #3a3029; padding: 6px 0; font-size: 10.5px; }
  .ticket .li:first-of-type { margin-top: 8px; }
  .chip { display: inline-block; margin-top: 4px; padding: 3px 9px; border-radius: 999px; font-weight: 700; font-size: 10px; background: rgba(76,195,138,.18); color: var(--success); }

  .stock { width: 176px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
  .stock i { width: 32px; height: 32px; border-radius: 9px; background: #efe6d8; font-style: normal; display: grid; place-items: center; font-size: 16px; flex: none; }
  .stock b { display: block; font-size: 12px; }
  .stock span { font-size: 10px; color: #8a8076; }
</style>
</head>
<body>
<div class="stage">

  <!-- ================= A · LIGHT ================= -->
  <template id="tpl-light">
    <div class="side r"><svg class="rib" viewBox="0 0 440 396" fill="none">
      <defs>
        <linearGradient id="r1" x1="0" x2="1"><stop offset="0" stop-color="#f2b25c"/><stop offset="1" stop-color="#e8673a"/></linearGradient>
        <linearGradient id="r2" x1="0" x2="1"><stop offset="0" stop-color="#e8673a"/><stop offset="1" stop-color="#c4461e"/></linearGradient>
        <linearGradient id="r3" x1="0" x2="1"><stop offset="0" stop-color="#7fd9a8"/><stop offset="1" stop-color="#1f7a4d"/></linearGradient>
        <linearGradient id="r4" x1="0" x2="1"><stop offset="0" stop-color="#ffe2b0"/><stop offset="1" stop-color="#f2b25c"/></linearGradient>
        <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#c4461e" flood-opacity=".28"/></filter>
      </defs>
      <g transform="translate(-1144 0)">
      <g filter="url(#sh)" stroke-linecap="round">
        <path d="M1250 210 C 1270 160, 1320 160, 1335 215" stroke="url(#r4)" stroke-width="22"/>
        <path d="M1345 250 C 1370 330, 1420 330, 1440 240" stroke="url(#r2)" stroke-width="26"/>
        <path d="M1440 240 C 1455 175, 1480 120, 1520 70" stroke="url(#r3)" stroke-width="26"/>
        <path d="M1375 120 C 1395 90, 1425 95, 1430 135" stroke="url(#r1)" stroke-width="20"/>
      </g>
      <g stroke="#fff" stroke-linecap="round" opacity=".55" fill="none">
        <path d="M1256 200 C 1274 165, 1314 165, 1328 205" stroke-width="5"/>
        <path d="M1352 262 C 1375 320, 1412 318, 1430 252" stroke-width="6"/>
        <path d="M1447 228 C 1462 170, 1484 128, 1514 88" stroke-width="6"/>
      </g>
      </g>
    </svg></div>
    <!-- small left accent (kept top-left, clear of the profile photo) -->
    <div class="side l"><svg class="rib" viewBox="0 0 440 396" fill="none">
      <g filter="url(#sh)" stroke-linecap="round">
        <path d="M120 90 C 150 40, 200 45, 215 95" stroke="url(#r1)" stroke-width="18"/>
        <circle cx="258" cy="140" r="11" fill="url(#r3)"/>
      </g>
    </svg></div>
    <div class="center">
      <div class="tagline">
        <span class="pill">Cut costs</span>
        <span class="chev">
          <svg viewBox="0 0 26 40"><path d="M4 4 L22 20 L4 36 Z" fill="#f2b25c"/></svg>
          <svg viewBox="0 0 26 40"><path d="M4 4 L22 20 L4 36 Z" fill="#e8673a"/></svg>
        </span>
        <span class="tag-text"><em>Automate</em> the rest.</span>
      </div>
      <div class="logos">
        <img src="green-leaf-grocers.png"><img src="spice-route-kitchen.png"><img src="carepoint-clinic.png"><img src="brightway-school.png"><img src="mediscan-diagnostics.png"><img src="urbanfit-studio.png">
      </div>
    </div>
    <div class="corner"><span>↗</span><img src="devsrecipe-logo-for-light-bg.png"></div>
  </template>

  <!-- ================= B · DARK SHOWCASE ================= -->
  <template id="tpl-dark">
    <svg class="ghost" style="left:34%;top:-40px;width:120px;transform:rotate(-14deg)" viewBox="0 0 48 48" fill="none"><path d="M5 27h38a19 19 0 0 1-38 0Z" fill="#fff"/><path d="M17 6l-7 7 7 7M31 6l7 7-7 7M27 4l-6 18" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg class="ghost" style="right:33%;bottom:-50px;width:110px;transform:rotate(12deg)" viewBox="0 0 48 48" fill="none"><path d="M5 27h38a19 19 0 0 1-38 0Z" fill="#fff"/><path d="M17 6l-7 7 7 7M31 6l7 7-7 7M27 4l-6 18" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>

    <div class="side l">
      <div class="card cal" style="left:24px;top:46px;transform:rotate(-7deg)">
        <div class="mono">Bookings</div>
        <div class="t">CarePoint · Nov</div>
        <div class="grid">
          <span>1</span><span class="bk">2</span><span>3</span><span class="bk">4</span><span>5</span><span>6</span><span>7</span>
          <span class="bk">8</span><span>9</span><span class="on">10</span><span class="bk">11</span><span>12</span><span class="bk">13</span><span>14</span>
        </div>
      </div>
      <div class="phone" style="left:212px;top:58px;transform:rotate(6deg)">
        <div class="scr">
          <div class="hero">Spice Route<br>Kitchen</div>
          <div class="row"><span style="display:flex;align-items:center"><span class="dot">🍛</span>Biryani</span><span>$12</span></div>
          <div class="row"><span style="display:flex;align-items:center"><span class="dot">🥗</span>Salad</span><span>$7</span></div>
          <div class="row"><span style="display:flex;align-items:center"><span class="dot">🥤</span>Lassi</span><span>$3</span></div>
          <div class="btn">Place order →</div>
        </div>
      </div>
      <div class="card d toast" style="left:40px;top:262px;transform:rotate(-3deg)"><i>✓</i>Order #1042 sent to kitchen</div>
      <div class="avatar" style="left:150px;top:180px;background:linear-gradient(135deg,#1f7a4d,#4cc38a)">GL</div>
    </div>

    <div class="side r">
      <div class="card dash" style="left:40px;top:40px;transform:rotate(5deg)">
        <div class="mono">Sales this week</div>
        <div class="big">$4,820<span>▲ 32%</span></div>
        <div class="bars"><i style="height:35%"></i><i style="height:50%"></i><i style="height:42%"></i><i style="height:64%"></i><i class="hi" style="height:78%"></i><i class="hi" style="height:100%"></i><i style="height:58%"></i></div>
      </div>
      <div class="card d ticket" style="left:280px;top:98px;transform:rotate(-6deg)">
        <div class="mono">Kitchen</div>
        <div class="no">Ticket #1042</div>
        <div class="li"><span>2 × Biryani</span><span>T4</span></div>
        <div class="li"><span>1 × Lassi</span><span>T4</span></div>
        <span class="chip">● Ready</span>
      </div>
      <div class="card stock" style="left:70px;top:248px;transform:rotate(-4deg)">
        <i>📦</i><div><b>Rice stock low</b><span>Auto-reordered from supplier</span></div>
      </div>
      <div class="avatar" style="left:250px;top:300px;background:linear-gradient(135deg,#e8673a,#f2b25c)">SR</div>
    </div>

    <div class="center">
      <div class="brand"><img src="devsrecipe-logo-for-dark-bg.png"></div>
      <div class="badges">
        <div class="badge"><i>🛒</i><div><small>We build</small><b>Ordering</b></div></div>
        <div class="badge"><i>📅</i><div><small>We build</small><b>Bookings</b></div></div>
        <div class="badge"><i>🧾</i><div><small>We build</small><b>POS &amp; Stock</b></div></div>
        <div class="badge"><i>🚀</i><div><small>We build</small><b>Startup MVPs</b></div></div>
      </div>
      <h1>Less manual work. <em>More business.</em></h1>
      <div class="logos">
        <img src="green-leaf-grocers.png"><img src="spice-route-kitchen.png"><img src="carepoint-clinic.png"><img src="brightway-school.png"><img src="mediscan-diagnostics.png"><img src="urbanfit-studio.png">
      </div>
    </div>
  </template>
</div>
<script>
  // hash: #<style>-<size>, e.g. #light-li, #dark-fb
  const [style, size] = (location.hash.slice(1) || "light-li").split("-");
  document.body.className = style + " " + size;
  const stage = document.querySelector(".stage");
  stage.appendChild(document.getElementById("tpl-" + style).content.cloneNode(true));
</script>
</body>
</html>
